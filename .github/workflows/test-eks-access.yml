name: Test EKS Access

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-cluster-access:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::210126447451:role/DLCGitHubActionsRole
          aws-region: us-east-2

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name hyperpod-helm-mq8xcnnj-eks-mq8xcnnj --region us-east-2

      - name: Test cluster access
        run: |
          kubectl get nodes
          kubectl get inferenceendpointconfig -A

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r test/vllm/hyperpod/requirements.txt

      - name: Run tests
        run: |
          cd test/vllm/hyperpod
          pytest -v -s test_cluster_access.py --rootdir=.
