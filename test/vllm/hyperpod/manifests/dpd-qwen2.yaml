apiVersion: inference.sagemaker.aws.amazon.com/v1
kind: InferenceEndpointConfig
metadata:
  name: dpd-qwen2
  namespace: dlc-tests
spec:
  endpointName: dpd-qwen2
  modelName: qwen2-dpd
  instanceType: ml.g5.8xlarge
  invocationEndpoint: v1/chat/completions
  modelSourceConfig:
    modelSourceType: s3
    s3Storage:
      bucketName: data-capture-models-for-inference-endpoints
      region: us-east-2
    modelLocation: 0316-0907
    prefetchEnabled: false
  loadBalancer:
    healthCheckPath: /health
  worker:
    resources:
      limits:
        nvidia.com/gpu: "1"
        cpu: "4"
        memory: 24Gi
      requests:
        nvidia.com/gpu: "1"
        cpu: "4"
        memory: 24Gi
    image: public.ecr.aws/deep-learning-containers/vllm:server-hyperpod-cuda-v1.1
    args:
      - "--model"
      - "/opt/ml/model"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--tensor-parallel-size"
      - "1"
      - "--max-model-len"
      - "8192"
    modelInvocationPort:
      containerPort: 8000
      name: http
    modelVolumeMount:
      name: model-weights
      mountPath: /opt/ml/model
    environmentVariables:
      - name: HF_HOME
        value: "/tmp/hf_home"
      - name: PD_BUFFER_SIZE
        value: "2139095040"
  metrics:
    enabled: true
  pdSpec:
    prefillSpec:
      replicas: 1
      resources:
        requests:
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
    decodingSpec:
      replicas: 1
      resources:
        requests:
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
    routingThreshold: 4096
