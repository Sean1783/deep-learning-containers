apiVersion: inference.sagemaker.aws.amazon.com/v1
kind: InferenceEndpointConfig
metadata:
  name: kv-cache-l1
  namespace: default
spec:
  endpointName: kv-cache-l1
  modelName: qwen2-1.5b-v2-test
  instanceType: ml.g5.8xlarge
  invocationEndpoint: v1/chat/completions
  modelSourceConfig:
    modelSourceType: s3
    s3Storage:
      bucketName: data-capture-models-for-inference-endpoints
      region: us-east-2
    modelLocation: 0316-0907
    prefetchEnabled: false
  kvCacheSpec:
    enableL1Cache: true
  worker:
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        cpu: "6"
        memory: 30Gi
        nvidia.com/gpu: "1"
    image: public.ecr.aws/deep-learning-containers/vllm:server-hyperpod-cuda-v1.1
    args:
    - "--model"
    - "/opt/ml/model"
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
    - "--max-model-len"
    - "10000"
    modelInvocationPort:
      containerPort: 8000
      name: http
    modelVolumeMount:
      name: model-weights
      mountPath: /opt/ml/model
    environmentVariables:
    - name: OPTION_ROLLING_BATCH
      value: "vllm"
    - name: SERVING_CHUNKED_READ_TIMEOUT
      value: "480"
    - name: DJL_OFFLINE
      value: "true"
    - name: NUM_SHARD
      value: "1"
    - name: SAGEMAKER_PROGRAM
      value: "inference.py"
    - name: SAGEMAKER_SUBMIT_DIRECTORY
      value: "/opt/ml/model/code"
    - name: MODEL_CACHE_ROOT
      value: "/opt/ml/model"
    - name: SAGEMAKER_MODEL_SERVER_WORKERS
      value: "1"
    - name: SAGEMAKER_MODEL_SERVER_TIMEOUT
      value: "3600"
    - name: OPTION_TRUST_REMOTE_CODE
      value: "true"
    - name: OPTION_ENABLE_REASONING
      value: "true"
    - name: OPTION_REASONING_PARSER
      value: "deepseek_r1"
    - name: SAGEMAKER_CONTAINER_LOG_LEVEL
      value: "20"
    - name: SAGEMAKER_ENV
      value: "1"
